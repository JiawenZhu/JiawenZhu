name: Refresh profile

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.md"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Redraw cards and now.json
        run: node scripts/refresh-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add README.md now.json assets
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh now-building card"
            git push
          fi
